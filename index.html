<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZenxiStore</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#080808;color:#f5f5f5;font-family:Inter,Arial,sans-serif;min-height:100vh}
a{color:inherit}
.nav{height:70px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1d1d1d;background:rgba(8,8,8,.92);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
.brand{text-decoration:none;font-weight:800;letter-spacing:2px}
.admin-link,.ghost{color:#aaa;text-decoration:none;background:#111;border:1px solid #292929;border-radius:8px;padding:9px 13px;cursor:pointer}
.admin-link:hover,.ghost:hover{color:#fff;border-color:#555}
.hero{min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 20px;background:radial-gradient(circle at 50% 45%,#1b1b1b 0,#080808 55%)}
.pill{font-size:11px;letter-spacing:2px;color:#aaa;border:1px solid #292929;border-radius:999px;padding:8px 13px}
.hero h1{font-size:clamp(44px,9vw,86px);line-height:.98;letter-spacing:-4px;margin:24px 0}
.hero h1 span{color:#707070}
.hero p,.muted{color:#777;line-height:1.6}
.btn{display:inline-block;background:#fff;color:#000;border:0;border-radius:9px;padding:13px 18px;font-weight:700;text-decoration:none;cursor:pointer}
.btn:hover{background:#ddd}
.full{width:100%}
.section{max-width:1150px;margin:auto;padding:85px 7%}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
.eyebrow{font-size:11px;letter-spacing:2px;color:#666;margin-bottom:8px}
h1,h2{letter-spacing:-1px}
h2{font-size:34px}
#search{width:240px;background:#101010;color:#fff;border:1px solid #252525;border-radius:9px;padding:13px;outline:0}
#search:focus,input:focus,textarea:focus,select:focus{border-color:#555}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#101010;border:1px solid #202020;border-radius:14px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#444}
.card-img{height:180px;background:#161616;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:17px}
.cat{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.card h3{font-size:17px;margin-bottom:9px}
.desc{font-size:13px;color:#777;min-height:38px;line-height:1.45}
.price{margin-top:14px;font-weight:800}
.badge{display:inline-block;margin-top:10px;font-size:10px;padding:5px 8px;border-radius:6px;border:1px solid #333;color:#aaa}
.sold{color:#666}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:#555;border:1px dashed #252525;border-radius:14px}
footer{padding:30px 7%;border-top:1px solid #171717;color:#444;font-size:12px}
.admin-wrap{max-width:1000px;margin:auto;padding:60px 7%}
.panel{background:#0f0f0f;border:1px solid #222;border-radius:15px;padding:24px}
.login{max-width:430px;margin:40px auto}
.login h1{margin-bottom:8px}
form{margin-top:24px}
label{display:block;font-size:12px;color:#aaa;margin-bottom:16px}
input,textarea,select{width:100%;margin-top:7px;background:#090909;color:#fff;border:1px solid #292929;border-radius:8px;padding:12px;outline:0;font:inherit}
textarea{resize:vertical}
.check{display:flex;align-items:center;gap:9px}
.check input{width:auto;margin:0}
.actions{display:flex;gap:10px}
.error{color:#d88;margin-top:12px;font-size:12px}
.hidden{display:none!important}
.admin-list{display:grid;gap:12px;margin-top:20px}
.admin-item{display:flex;align-items:center;gap:15px;background:#101010;border:1px solid #202020;border-radius:12px;padding:12px}
.admin-item img{width:75px;height:55px;object-fit:cover;border-radius:8px;background:#171717}
.admin-info{flex:1}
.admin-info strong{display:block;margin-bottom:5px}
.admin-info small{color:#666}
.item-actions{display:flex;gap:7px}
.item-actions button{padding:8px 10px;border-radius:7px;border:1px solid #292929;background:#151515;color:#aaa;cursor:pointer}
.item-actions button:hover{color:#fff}
.product-form{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.product-form label:nth-of-type(4),.product-form label:nth-of-type(5),.product-form label:nth-of-type(6),.product-form .check,.product-form .actions{grid-column:1/-1}
@media(max-width:650px){.nav{padding:0 20px}.hero h1{letter-spacing:-2px}.section,.admin-wrap{padding:65px 20px}.section-head{display:block}.section-head #search{width:100%;margin-top:18px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card-img{height:135px}.card-body{padding:13px}.card h3{font-size:14px}.product-form{display:block}.admin-item{align-items:flex-start}.item-actions{flex-direction:column}}


.owner-panel{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);overflow:auto;padding:30px 20px}
.owner-card{max-width:850px;margin:40px auto;background:#0d0d0d;border:1px solid #292929;border-radius:16px;padding:25px;box-shadow:0 20px 70px rgba(0,0,0,.5)}
.owner-head,.owner-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}
.owner-actions{margin:20px 0}

</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="index.html">ZenxiStore</a>
  <button type="button" id="openOwner" class="admin-link" onclick="openOwnerPanel()">Owner</button>
</header>

<main>
  <section class="hero">
    <span class="pill">ZENXISTORE</span>
    <h1>Selamat datang ke Zenxi Store<br><span>Product Preview</span></h1>
    <p>scroll kebawah untuk melihat pilihan produk.</p>
    <a class="btn" href="#products">View products</a>
  </section>

  <section id="products" class="section">
    <div class="section-head">
      <div>
        <p class="eyebrow">CATALOG</p>
        <h2>Products</h2>
      </div>
      <input id="search" type="search" placeholder="Search...">
    </div>
    <div id="product-list" class="grid"></div>
  </section>

<!-- OWNER PANEL -->
<section id="ownerPanel" class="owner-panel hidden">
  <div class="owner-card">
    <div class="owner-head">
      <div>
        <p class="eyebrow">OWNER PANEL</p>
        <h2>Manage Products</h2>
      </div>
      <button type="button" id="closeOwner" class="ghost">Close</button>
    </div>

    <div id="ownerLogin">
      <p class="muted">Sign in to manage the catalog.</p>
      <form id="singleLogin">
        <label>Username<input id="singleUser" required></label>
        <label>Password<input id="singlePass" type="password" required></label>
        <button class="btn full" type="submit">Login</button>
        <p id="singleError" class="error"></p>
      </form>
    </div>

    <div id="ownerDashboard" class="hidden">
      <div class="owner-actions">
        <button type="button" id="singleNew" class="btn">+ Add Product</button>
        <button type="button" id="singleLogout" class="ghost">Logout</button>
      </div>

      <form id="singleProductForm" class="product-form">
        <input type="hidden" id="singleId">
        <label>Product name<input id="singleName" required></label>
        <label>Category
          <select id="singleCategory">
            <option value="game">Game</option>
            <option value="topup">Topup</option>
            <option value="service">Service</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label>Price<input id="singlePrice" placeholder="RM 10.00" required></label>
        <label>Image URL
      <input id="singleImage" placeholder="https://...">
    </label>
    <label>Upload Image
      <input id="singleImageFile" type="file" accept="image/*">
      <small class="muted">Pilih gambar dari phone/PC. Gambar akan disimpan dalam browser.</small>
    </label>
        <label>Description<textarea id="singleDescription" rows="3"></textarea></label>
        <label class="check"><input id="singleAvailable" type="checkbox" checked> Available</label>
        <div class="actions">
          <button class="btn" type="submit">Save Product</button>
          <button id="singleCancel" class="ghost" type="button">Cancel</button>
        </div>
      </form>

      <div id="singleAdminList" class="admin-list"></div>
    </div>
  </div>
</section>

</main>

<footer>© 2026 ZenxiStore</footer>
<script>
const KEY="rynnextdoor_products";
const products=JSON.parse(localStorage.getItem(KEY)||"[]");
const grid=document.getElementById("product-list");
const search=document.getElementById("search");

function save(){localStorage.setItem(KEY,JSON.stringify(products));}
function render(list=products){
  if(!list.length){grid.innerHTML='<div class="empty">No products available yet.</div>';return;}
  grid.innerHTML=list.map(p=>`
    <article class="card">
      <div class="card-img"><img src="${escapeHtml(p.image||"https://placehold.co/600x400/151515/ffffff?text=PRODUCT")}" alt=""></div>
      <div class="card-body">
        <div class="cat">${escapeHtml(p.category)}</div>
        <h3>${escapeHtml(p.name)}</h3>
        <p class="desc">${escapeHtml(p.description||"")}</p>
        <div class="price">${escapeHtml(p.price)}</div>
        <span class="badge ${p.available?"":"sold"}">${p.available?"Available":"Sold out"}</span>
      </div>
    </article>`).join("");
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
if(search) search.addEventListener("input",()=>{const q=search.value.toLowerCase();render(products.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));});
render();

const OWNER_USER = "Zenxi";
const OWNER_PASS = "ZenxiLowkey";
const PRODUCT_KEY = "rynnextdoor_products";

const ownerPanel = document.getElementById("ownerPanel");
const ownerLogin = document.getElementById("ownerLogin");
const ownerDashboard = document.getElementById("ownerDashboard");
const adminList = document.getElementById("singleAdminList");

function ownerProducts(){ return JSON.parse(localStorage.getItem(PRODUCT_KEY) || "[]"); }
function saveOwnerProducts(a){ localStorage.setItem(PRODUCT_KEY, JSON.stringify(a)); }
function escOwner(v){ return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }

function renderOwner(){
  const a=ownerProducts();
  adminList.innerHTML = a.length ? a.map((p,i)=>`
    <div class="admin-item">
      <img src="${escOwner(p.image || "https://placehold.co/300x200/151515/ffffff?text=PRODUCT")}" alt="">
      <div class="admin-info"><strong>${escOwner(p.name)}</strong><small>${escOwner(p.price)} · ${escOwner(p.category)} · ${p.available ? "Available":"Sold out"}</small></div>
      <div class="item-actions">
        <button onclick="singleEdit(${i})">Edit</button>
        <button onclick="singleDelete(${i})">Delete</button>
      </div>
    </div>`).join("") : '<div class="empty">No products yet. Add your first product.</div>';
}

function resetOwnerForm(){
  document.getElementById("singleProductForm").reset();
  selectedImageData = "";
  document.getElementById("singleId").value="";
  document.getElementById("singleAvailable").checked=true;
}

window.singleEdit=function(i){
  const p=ownerProducts()[i];
  document.getElementById("singleId").value=i;
  document.getElementById("singleName").value=p.name;
  document.getElementById("singleCategory").value=p.category;
  document.getElementById("singlePrice").value=p.price;
  document.getElementById("singleImage").value=p.image || "";
  document.getElementById("singleDescription").value=p.description || "";
  document.getElementById("singleAvailable").checked=!!p.available;
  document.getElementById("singleName").focus();
};

window.singleDelete=function(i){
  if(!confirm("Delete this product?")) return;
  const a=ownerProducts(); a.splice(i,1); saveOwnerProducts(a); renderOwner();
  if(typeof render==="function") render();
};

function openOwnerPanel(){
  const panel = document.getElementById("ownerPanel");
  const login = document.getElementById("ownerLogin");
  const dashboard = document.getElementById("ownerDashboard");
  if(!panel) return;
  panel.classList.remove("hidden");
  if(sessionStorage.getItem("zenxi_owner")==="1"){
    login.classList.add("hidden");
    dashboard.classList.remove("hidden");
    renderOwner();
  }else{
    login.classList.remove("hidden");
    dashboard.classList.add("hidden");
    document.getElementById("singleUser").focus();
  }
}

document.getElementById("openOwner").addEventListener("click", openOwnerPanel);

document.getElementById("closeOwner").onclick=()=>ownerPanel.classList.add("hidden");

document.getElementById("singleLogin").onsubmit=(e)=>{
  e.preventDefault();
  if(document.getElementById("singleUser").value===OWNER_USER &&
     document.getElementById("singlePass").value===OWNER_PASS){
    sessionStorage.setItem("zenxi_owner","1");
    document.getElementById("singleError").textContent="";
    ownerLogin.classList.add("hidden");
    ownerDashboard.classList.remove("hidden");
    renderOwner();
  }else{
    document.getElementById("singleError").textContent="Wrong username or password.";
  }
};

document.getElementById("singleLogout").onclick=()=>{
  sessionStorage.removeItem("zenxi_owner");
  ownerDashboard.classList.add("hidden");
  ownerLogin.classList.remove("hidden");
};

document.getElementById("singleNew").onclick=()=>{
  resetOwnerForm();
  document.getElementById("singleName").focus();
};

document.getElementById("singleCancel").onclick=resetOwnerForm;

let selectedImageData = "";

document.getElementById("singleImageFile").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 2 * 1024 * 1024){
    alert("Gambar terlalu besar. Sila pilih gambar bawah 2MB.");
    e.target.value = "";
    selectedImageData = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{ selectedImageData = reader.result; };
  reader.readAsDataURL(file);
});

document.getElementById("singleProductForm").onsubmit=(e)=>{
  e.preventDefault();
  const a=ownerProducts();
  const id=document.getElementById("singleId").value;
  const p={
    name:document.getElementById("singleName").value.trim(),
    category:document.getElementById("singleCategory").value,
    price:document.getElementById("singlePrice").value.trim(),
    image:selectedImageData || document.getElementById("singleImage").value.trim(),
    description:document.getElementById("singleDescription").value.trim(),
    available:document.getElementById("singleAvailable").checked
  };
  if(id==="") a.push(p); else a[Number(id)]=p;
  saveOwnerProducts(a);
  resetOwnerForm();
  renderOwner();
  if(typeof render==="function") render();
};

if(sessionStorage.getItem("zenxi_owner")==="1"){
  ownerLogin.classList.add("hidden");
  ownerDashboard.classList.remove("hidden");
}

</script>
</body>
</html>
